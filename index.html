<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐞 Oliver's Games</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; background: #0b0f1c; color: #fff; font-family: 'Trebuchet MS', system-ui, sans-serif; text-align: center; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 44px; margin: 0 0 8px; }
    p { opacity: .8; margin: 0 0 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .card { display: block; padding: 28px 12px; border-radius: 14px; background: #3b4a9a; color: #fff; font-weight: bold; font-size: 20px; text-decoration: none; border: 2px solid #fff3; }
    .card:hover { background: #4d5fc2; }
  </style>
</head>
<body>
  <main>
    <h1>🐞 Oliver's Games</h1>
    <p>Pick one and play!</p>
    <div class="grid">
      <a class="card" href="./ant-sized-smoothie-maker/">Ant-Sized Smoothie Maker</a>
    </div>
  </main>
</body>
</html>
