<!doctype html>
<html lang="en">

  <main id="app">
    <div id="view"></div>
    <div id="hud" hidden>
      <p id="status"></p>
      <p id="message"></p>
      <div id="crosshair"></div>
      <div id="minebar" hidden><i></i></div>
      <button id="end-turn" hidden>I'm hidden! (end turn)</button>
      <button id="give-up" hidden>Give up</button>
      <p id="hint"></p>

        <button id="players-1">1</button><button id="players-2">2</button><button id="players-3">3</button><button id="players-4">4</button><button id="players-5">5</button>
      </div>
    </section>
    <section id="seeker-pick" class="panel" hidden>
      <h2>Who wants to be the seeker?</h2>
      <div class="row" id="seeker-buttons"></div>
    </section>
    <section id="block-pick" class="panel" hidden>
      <h2 id="pick-title"></h2>
      <div class="row" id="block-buttons"></div>

    <section id="powerup-pick" class="panel" hidden>

    </section>
    <section id="cover" hidden><button id="cover-btn"></button></section>
    <section id="over" class="panel" hidden>
      <h2 id="over-title"></h2>
      <p id="over-text"></p>
      <button id="again">Play again</button>
    </section>
  </main>
